{% extends "admin/base.html" %}

{% block content %}
<header class="page-header">
    <div>
        <h1>Пользователи</h1>
        <p>Поиск, подписка, блокировки и быстрые действия.</p>
    </div>
</header>

<section class="panel">
    <form class="toolbar"
          hx-get="/users/table"
          hx-target="#users-table"
          hx-trigger="keyup changed delay:300ms, submit">
        <input
            type="search"
            name="q"
            value="{{ q }}"
            placeholder="user_id"
            inputmode="numeric"
            autocomplete="off">
        <button type="submit">Найти</button>
        <a class="secondary-button" href="/users">Сбросить</a>
    </form>
    <div id="users-table">
        {% include "admin/partials/users_table.html" %}
    </div>
</section>
{% endblock %}
