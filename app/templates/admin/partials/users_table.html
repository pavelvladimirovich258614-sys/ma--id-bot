<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>user_id</th>
                <th>username</th>
                <th>подписка</th>
                <th>бан</th>
                <th>активность</th>
                <th>действия</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td><code>{{ user.user_id }}</code></td>
                    <td>{{ user.username or "—" }}</td>
                    <td>
                        <span class="badge {{ 'ok' if user.is_subscribed else 'muted-badge' }}">
                            {{ "да" if user.is_subscribed else "нет" }}
                        </span>
                    </td>
                    <td>
                        <span class="badge {{ 'danger' if user.is_banned else 'ok' }}">
                            {{ "ban" if user.is_banned else "active" }}
                        </span>
                    </td>
                    <td>{{ user.last_activity or "—" }}</td>
                    <td class="actions">
                        <button
                            hx-post="/users/{{ user.user_id }}/toggle-ban"
                            hx-target="#users-table"
                            hx-swap="innerHTML">
                            {{ "Разбан" if user.is_banned else "Бан" }}
                        </button>
                        <button
                            hx-post="/users/{{ user.user_id }}/reset-subscription"
                            hx-target="#users-table"
                            hx-swap="innerHTML">
                            Сбросить статус подписки
                        </button>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="6" class="empty">Пользователи не найдены.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
