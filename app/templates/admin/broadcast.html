{% extends "admin/base.html" %}

{% block content %}
<header class="page-header">
    <div>
        <h1>Рассылки</h1>
        <p>Фоновые отправки через Celery и Redis с лимитом MAX 30 rps.</p>
    </div>
</header>

<section class="panel">
    <form class="broadcast-form"
          hx-post="/broadcast/send"
          enctype="multipart/form-data"
          hx-target="#broadcast-progress"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']">
        <label for="text">Текст сообщения</label>
        <textarea id="text" name="text" rows="7" maxlength="4000" required placeholder="Введите текст рассылки"></textarea>

        <div class="form-grid">
            <label>
                Тип медиа
                <select name="media_type">
                    <option value="">Без медиа</option>
                    <option value="image">Изображение</option>
                    <option value="video">Короткое видео</option>
                </select>
            </label>
            <label>
                file_id из MAX
                <input name="media_file_id" type="text" placeholder="Оставьте пустым при загрузке файла">
            </label>
        </div>

        <label>
            Загрузить изображение или видео
            <input name="media_upload" type="file" accept="image/*,video/*">
        </label>

        <button type="submit">
            <span class="submit-idle">Запустить рассылку</span>
            <span class="submit-busy">Запускаем...</span>
        </button>
    </form>
    <div id="broadcast-progress" class="progress-host">
        <p class="muted">Прогресс появится после запуска.</p>
    </div>
</section>
{% endblock %}
